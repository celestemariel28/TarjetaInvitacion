<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación 50 Años - Mónica Orona</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; 
            overflow: hidden;
        }

        .tarjeta {
            position: relative;
            width: 100%;
            max-width: 400px; 
            height: 100vh;
            max-height: 800px;
            background-image: url('img/fondo.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            z-index: 1;
        }

        /* --- ANIMACIONES --- */
        @keyframes crecerShrink {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes balanceo {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes escribir {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes parpadeo {
            50% { border-color: transparent; }
        }

        @keyframes aparecerPalabra {
            0% { opacity: 0; transform: translateY(10px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- ESCENA 1 --- */
        .escena-1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out;
            z-index: 10;
        }

        .numero-50 { width: 250px; animation: flotar 3s infinite ease-in-out; }
        .zapatos { width: 180px; animation: balanceo 3s infinite ease-in-out; transform-origin: bottom center; }
        .nombre {
            width: 80%; text-align: center; font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #d4af37;
            text-shadow: 1px 1px 3px #000; white-space: nowrap; overflow: hidden; border-right: 3px solid #d4af37;
            animation: escribir 3s steps(30, end) forwards, parpadeo 0.8s infinite;
        }

        /* --- ESCENA 2 --- */
        .escena-2 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 20;
        }

        /* =========================================
           CASET RETRO FIEL A LA FOTO
           ========================================= */
        .caset {
            width: 240px;
            height: 170px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 3px solid #333;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.8), 
                inset 0 0 15px rgba(255,255,255,0.05),
                0 0 0 2px #000;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            animation: flotar 4s infinite ease-in-out;
        }

        .caset-etiqueta {
            width: 100%;
            height: 45px;
            background: linear-gradient(135deg, #f5d3e4, #e8b7d2);
            border-radius: 5px;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .caset-etiqueta::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 10px;
            right: 10px;
            height: 2px;
            background: rgba(0,0,0,0.1);
        }

        .caset-ventana {
            width: 100%;
            height: 60px;
            background: #111111;
            border-radius: 5px;
            border: 2px solid #bb3f6e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .cinta {
            width: 40px;
            height: 40px;
            background: #700126;
            border-radius: 50%;
            border: 3px solid #555;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinta::after {
            content: '';
            width: 15px;
            height: 15px;
            background: #d4af37;
            border-radius: 50%;
            border: 2px solid #f5d76e;
        }

        .caset-botones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .boton-grupo {
            display: flex;
            gap: 8px;
        }

        .boton {
            width: 18px;
            height: 12px;
            background: #444444;
            border-radius: 3px;
            border: 1px solid #222;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.1);
        }

        .boton-play {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            border-radius: 50%;
            border: 3px solid #8b6914;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.5);
            transition: transform 0.2s;
        }

        .boton-play:hover {
            transform: scale(1.1);
        }

        .boton-play svg {
            width: 20px;
            height: 20px;
            fill: #333;
            margin-left: 1.5px;
        }

        .boton-play.pausado svg {
            display: none;
        }

        .boton-play.pausado::after {
            content: '❚❚';
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        .frase {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            text-align: center;
            color: #ffb0db;
            text-shadow: 1px 1px 3px #000, 0 0 10px rgba(255, 176, 219, 0.6);
            line-height: 1.4;
            padding: 0 20px;
            width: 80%;
        }

        .frase span {
            opacity: 0;
            display: inline-block;
            animation: aparecerPalabra 0.8s forwards;
        }

                /* --- ESCENA 3 --- */
        .escena-3 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 30;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .escena-3 .numero-50 {
            width: 150px;
            animation: flotar 3s infinite ease-in-out;
            margin-bottom: -5px;
        }

        .escena-3 .nombre-monica {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #d4af37;
            text-shadow: 1px 1px 3px #000;
            margin-top: -15px;
            margin-bottom: 0px;
            line-height: 1;
        }

        .subtitulo {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        .frase-invitacion {
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            color: #ffb0db;
            text-shadow: 1px 1px 3px #000;
            line-height: 1.3;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .mes {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 1px 1px 2px #000;
        }

        .fecha-hora {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px #000;
        }

        .fecha-hora .linea {
            width: 30px;
            height: 2px;
            background-color: #d4af37;
        }

        .fecha-hora .dia-semana {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fecha-hora .dia-numero {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .fecha-hora .hora {
            font-size: 0.9rem;
        }

        .lugar {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #ffb0db;
            line-height: 1.4;
            text-shadow: 1px 1px 2px #000;
        }

        .lugar a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px solid #d4af37;
            transition: color 0.3s;
        }

        .lugar a:hover {
            color: #f5d76e;
        }

        #musica {
            display: none;
        }
        /* --- ESCENA 4 --- */
        .escena-4 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 40;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            gap: 8px;
        }

        /* Adorno superior (más grande) */
        .escena-4 .adorno-superior {
            width: 250px;
            margin-bottom: 5px;
            opacity: 0.9;
            animation: flotar 3s infinite ease-in-out;
        }

        /* Frase principal con letras doradas y centradas */
        .frase-4 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.35rem;
            color: #d4af37;
            text-shadow: 1px 1px 3px #000, 0 0 8px rgba(212, 175, 55, 0.4);
            line-height: 1.5;
            padding: 0 15px;
            width: 90%;
            box-sizing: border-box;
            text-align: center;
        }

        .frase-4 span {
            opacity: 0;
            display: inline-block;
            animation: aparecerZoom 0.9s forwards ease-out;
        }

        /* Imagen de los zapatos dorados (más pequeña) */
        .imagen-escena-4 {
            width: 90px;
            margin-top: 5px;
            margin-bottom: 10px;
            animation: balanceo 4s infinite ease-in-out;
            transform-origin: bottom center;
            z-index: 41;
            pointer-events: none;
        }

        /* Texto "¿Nos acompañás?" */
        .nos-acompanas {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #9e6b6b;
            margin-top: 5px;
            margin-bottom: 0px;
            text-shadow: 1px 1px 2px rgb(148, 81, 81);
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 1.5s;
        }

        /* Texto "CONFIRMAR ANTES DEL 07/10" */
        .confirmar-fecha {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3), 0 0 8px rgba(212, 175, 55, 0.5);
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 2s;
        }

        /* --- BOTONES DE WHATSAPP --- */
        .botones-whatsapp {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
            max-width: 280px;
            margin-top: 0px;
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 2.5s;
        }

        .boton-wpp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .boton-wpp:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .boton-si {
            background-color: #9e6b6b;
            color: #fff;
            border-color: #d4af37;
        }

        .boton-si:hover {
            background-color: #8a5a5a;
        }

        .boton-no {
            background-color: transparent;
            color: #5a3e2b;
            border-color: #d4af37;
        }

        .boton-no:hover {
            background-color: rgba(212, 175, 55, 0.1);
        }

        .boton-wpp .icono {
            font-size: 1.1rem;
        }

        /* Animación de zoom */
        @keyframes aparecerZoom {
            0% { 
                opacity: 0; 
                transform: scale(0.3); 
                filter: brightness(3);
            }
            60% {
                opacity: 1;
                transform: scale(1.1);
                filter: brightness(1.5);
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
                filter: brightness(1);
            }
        }

        /* Animación de desvanecimiento suave (por si acaso) */
        @keyframes aparecerDesvanecido {
            0% { 
                opacity: 0; 
                transform: translateY(15px); 
                filter: blur(8px);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0); 
                filter: blur(0);
            }
        }

        /* Nueva animación: Zoom suave con brillo */
        @keyframes aparecerZoom {
            0% { 
                opacity: 0; 
                transform: scale(0.3); 
                filter: brightness(3);
            }
            60% {
                opacity: 1;
                transform: scale(1.1);
                filter: brightness(1.5);
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
                filter: brightness(1);
            }
        }

        /* Nueva animación de desvanecimiento suave */
        @keyframes aparecerDesvanecido {
            0% { 
                opacity: 0; 
                transform: translateY(15px); 
                filter: blur(8px);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0); 
                filter: blur(0);
            }
        }

    </style>
</head>
<body>

    <div class="tarjeta">
        
        <!-- ESCENA 1 -->
        <div class="escena-1" id="escena1">
            <img src="img/50.png" alt="50 Años" class="numero-50">
            <div class="nombre">Mónica Orona</div>
            <img src="img/zapatos.png" alt="Zapatos" class="zapatos">
        </div>

        <!-- ESCENA 2 -->
        <div class="escena-2" id="escena2">
            <div class="caset">
                <div class="caset-etiqueta">Reproduce la música</div>
                <div class="caset-ventana">
                    <div class="cinta"></div>
                    <div class="cinta"></div>
                </div>
                <div class="caset-botones">
                    <div class="boton-grupo">
                        <div class="boton"></div>
                        <div class="boton"></div>
                    </div>
                    <div class="boton-play" id="btnPlay" onclick="toggleMusica()">
                        <svg viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <div class="boton-grupo">
                        <div class="boton"></div>
                        <div class="boton"></div>
                    </div>
                </div>
            </div>
            <div class="frase" id="frase"></div>
        </div>

        <!-- ESCENA 3 -->
        <div class="escena-3" id="escena3">
            <img src="img/50.png" alt="50 Años" class="numero-50">
            <div class="nombre-monica">Mónica</div>
            <div class="subtitulo">Mis Años Dorados</div>
            
            <div class="frase-invitacion">
                Acompañame a Celebrar 50 años de camino. 
                Tu presencia hará que este día sea inolvidable.
            </div>

            <div class="mes">Octubre</div>
            
            <div class="fecha-hora">
                <span class="dia-semana">Viernes</span>
                <span class="linea"></span>
                <span class="dia-numero">10</span>
                <span class="linea"></span>
                <span class="hora">22:00 PM</span>
            </div>

            <div class="lugar">
                <strong>Lugar:</strong><br>
                <a href="https://www.google.com/maps/search/?api=1&query=La+Rioja+135,+Concepción,+Tucumán" target="_blank">
                    La Rioja 135, Concepción, Tucumán
                </a>
            </div>
        </div>

                <!-- ESCENA 4 -->
                <!-- ESCENA 4 -->
        <div class="escena-4" id="escena4">
            <!-- Adorno superior -->
            <img src="img/adorno.png" alt="Adorno" class="adorno-superior">
            
            <!-- Frase con efecto de zoom -->
            <div class="frase-4" id="frase4"></div>
                        
            <!-- Texto "¿Nos acompañás?" -->
            <div class="nos-acompanas">¿Nos acompañás?</div>
            
            <!-- Texto "CONFIRMAR ANTES DEL 07/10" -->
            <div class="confirmar-fecha">Confirmar antes del 07/10</div>
            
            <!-- Botones de confirmación por WhatsApp -->
            <div class="botones-whatsapp">
                <a href="https://wa.me/5493865621835?text=Hola%20Mónica,%20confirmo%20mi%20asistencia%20a%20tus%2050%20años.%20¡Sí,%20podré%20asistir!" 
                   target="_blank" 
                   class="boton-wpp boton-si">
                    <span class="icono">✓</span> SÍ, PODRÉ ASISTIR
                </a>
                <a href="https://wa.me/5493865621835?text=Hola%20Mónica,%20lamento%20informarte%20que%20no%20podré%20asistir%20a%20tus%2050%20años." 
                   target="_blank" 
                   class="boton-wpp boton-no">
                    <span class="icono">✕</span> NO PODRÉ ASISTIR
                </a>
            </div>
        </div>

    </div>

    <audio id="musica" src="img/bongo.mp3" preload="auto" loop></audio>

    <script>
        // --- CONFIGURACIÓN DE TIEMPOS ---
        const TIEMPO_ESPERA_ESCENA_1 = 5000;  // 5 segundos para la Escena 1
        const TIEMPO_ESPERA_ESCENA_2 = 8000; // 8 segundos para la Escena 2
        const TIEMPO_ENTRE_PALABRAS = 300;    // 0.3 segundos entre palabras

        // --- LÓGICA DE TRANSICIÓN ---
        
        // Escena 1 -> Escena 2
        setTimeout(() => {
            document.getElementById('escena1').style.opacity = '0';
            document.getElementById('escena1').style.pointerEvents = 'none';

            const escena2 = document.getElementById('escena2');
            escena2.style.opacity = '1';
            escena2.style.pointerEvents = 'auto';

            iniciarEfectoPalabras();

                        // Escena 2 -> Escena 3
            setTimeout(() => {
                document.getElementById('escena2').style.opacity = '0';
                document.getElementById('escena2').style.pointerEvents = 'none';

                const escena3 = document.getElementById('escena3');
                escena3.style.opacity = '1';
                escena3.style.pointerEvents = 'auto';

                // Escena 3 -> Escena 4 (después de 8 segundos)
                setTimeout(() => {
                    document.getElementById('escena3').style.opacity = '0';
                    document.getElementById('escena3').style.pointerEvents = 'none';

                    const escena4 = document.getElementById('escena4');
                    escena4.style.opacity = '1';
                    escena4.style.pointerEvents = 'auto';

                    iniciarEfectoDesvanecido();

                }, 8000); // 8 segundos de espera

            }, TIEMPO_ESPERA_ESCENA_2);

        }, TIEMPO_ESPERA_ESCENA_1);

        // --- EFECTO DE APARICIÓN LETRA POR LETRA (RESPETANDO PALABRAS) ---
        function iniciarEfectoPalabras() {
            const fraseTexto = "Acompáñame a celebrar un año más de vida... pasemos una noche agradable, recordemos viejos tiempos y hagamos nuevas memorias.";
            const contenedorFrase = document.getElementById('frase');
            const palabras = fraseTexto.split(" ");
            contenedorFrase.innerHTML = "";

            let contadorLetras = 0;

            palabras.forEach((palabra) => {
                const spanPalabra = document.createElement('span');
                spanPalabra.style.display = 'inline-block';
                spanPalabra.style.whiteSpace = 'nowrap';

                for (let i = 0; i < palabra.length; i++) {
                    const letra = palabra[i];
                    const spanLetra = document.createElement('span');
                    spanLetra.textContent = letra;
                    spanLetra.style.animationDelay = (contadorLetras * (TIEMPO_ENTRE_PALABRAS / 7000)) + "s";
                    spanPalabra.appendChild(spanLetra);
                    contadorLetras++;
                }

                const espacio = document.createElement('span');
                espacio.innerHTML = "&nbsp;";
                espacio.style.animationDelay = (contadorLetras * (TIEMPO_ENTRE_PALABRAS / 1000)) + "s";
                spanPalabra.appendChild(espacio);
                contadorLetras++;

                contenedorFrase.appendChild(spanPalabra);
            });
        }
                // --- EFECTO DE APARICIÓN ZOOM (ESCENA 4) ---
        function iniciarEfectoDesvanecido() {
            const fraseTexto = "Porque la vida no se mide en años, sino en los momentos compartidos con las personas que aman. Este será un momento para recordar.";
            const contenedorFrase = document.getElementById('frase4');
            const palabras = fraseTexto.split(" ");
            contenedorFrase.innerHTML = "";

            palabras.forEach((palabra, index) => {
                const spanPalabra = document.createElement('span');
                spanPalabra.style.display = 'inline-block';
                spanPalabra.style.whiteSpace = 'nowrap';
                spanPalabra.textContent = palabra + " ";
                spanPalabra.style.animationDelay = (index * 0.25) + "s";
                contenedorFrase.appendChild(spanPalabra);
            });
        }

        // --- FUNCIÓN PARA REPRODUCIR/PAUSAR MÚSICA ---
        let reproduciendo = false;
        function toggleMusica() {
            const musica = document.getElementById('musica');
            const btn = document.getElementById('btnPlay');
            
            if (reproduciendo) {
                musica.pause();
                btn.classList.add('pausado');
            } else {
                musica.play();
                btn.classList.remove('pausado');
            }
            reproduciendo = !reproduciendo;
        }
    </script>

</body>
</html>
