<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación 50 Años - Mónica Orona</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; 
            overflow: hidden;
        }

        .tarjeta {
            position: relative;
            width: 100%;
            max-width: 400px; 
            height: 100vh;
            max-height: 800px;
            background-image: url('img/fondo.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            z-index: 1;
        }

        /* --- ANIMACIONES --- */
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes balanceo {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes escribir {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes parpadeo {
            50% { border-color: transparent; }
        }

        @keyframes aparecerPalabra {
            0% { opacity: 0; transform: translateY(10px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes aparecerZoom {
            0% { opacity: 0; transform: scale(0.3); filter: brightness(3); }
            60% { opacity: 1; transform: scale(1.1); filter: brightness(1.5); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }

        @keyframes latido {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* --- ANIMACIÓN DE CAÍDA (ESCENA 0) --- */
        @keyframes caerSobre {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            15% { transform: translateY(-30px) rotate(-5deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(25deg); opacity: 0; }
        }

        @keyframes caerTexto {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            15% { transform: translateY(-20px) rotate(3deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(-18deg); opacity: 0; }
        }

        @keyframes caerBoton {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            15% { transform: translateY(-15px) rotate(-3deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(15deg); opacity: 0; }
        }

        .escena-0.cayendo .sorpresa-texto {
            animation: caerTexto 1.4s forwards ease-in;
        }

        .escena-0.cayendo .sobre-img {
            animation: caerSobre 1.4s forwards ease-in;
        }

        .escena-0.cayendo .btn-abrir {
            animation: caerBoton 1.4s forwards ease-in;
        }

        /* --- ESCENA 0 (SOBRE) --- */
        .escena-0 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.6s ease-in-out;
            z-index: 50;
            padding: 70px;
            box-sizing: border-box;
            text-align: center;
        }

        .sorpresa-texto {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #d4af37;
            text-shadow: 1px 1px 4px #000, 0 0 12px rgba(212, 175, 55, 0.5);
            animation: flotar 3s infinite ease-in-out;
            margin: 0;
            line-height: 1.2;
        }

        .sobre-img {
            width: 90%;
            max-width: 250px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: flotar 4s infinite ease-in-out;
            margin: 0;
            padding: 0;
        }

        .btn-abrir {
            margin-top: 5px;
            padding: 12px 35px;
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #9e6b6b, #b5838d);
            border: 2px solid #d4af37;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            animation: latido 2s infinite;
        }

        .btn-abrir:hover {
            transform: scale(1.06);
            background: linear-gradient(135deg, #8a5a5a, #9e6b6b);
        }

        /* --- ESCENA 1 --- */
        .escena-1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 10;
        }

        .numero-50 { width: 250px; animation: flotar 3s infinite ease-in-out; }
        .zapatos { width: 180px; animation: balanceo 3s infinite ease-in-out; transform-origin: bottom center; }
        
        .nombre {
            width: 80%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #d4af37;
            text-shadow: 1px 1px 3px #000;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid transparent;
        }

        .nombre.escribiendo {
            animation: escribir 3s steps(30, end) forwards, parpadeo 0.8s infinite;
            border-right-color: #d4af37;
        }

        /* --- FIRMA (invitacionde.digics.app) --- */
        .firma {
            margin-top: 8px;
            font-family: 'Playfair Display', serif;
            font-size: 0.65rem;
            color: rgba(212, 175, 55, 0.7);
            letter-spacing: 1.5px;
            text-transform: lowercase;
            text-decoration: none;
            transition: color 0.3s, opacity 0.3s;
            opacity: 0.75;
        }

        .firma:hover {
            color: #f5d76e;
            opacity: 1;
        }

        /* --- ESCENA 3 --- */
        .escena-3 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 30;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .escena-3 .numero-50 {
            width: 150px;
            animation: flotar 3s infinite ease-in-out;
            margin-bottom: -5px;
        }

        .escena-3 .nombre-monica {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #d4af37;
            text-shadow: 1px 1px 3px #000;
            margin-top: -15px;
            margin-bottom: 0px;
            line-height: 1;
        }

        .subtitulo {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        .frase-invitacion {
            font-family: 'Dancing Script', cursive;
            font-size: 1.45rem;
            color: #ffb0db;
            text-shadow: 1px 1px 3px #000;
            line-height: 1.4;
            margin-bottom: 12px;
            padding: 0 5px;
            width: 80%;
            box-sizing: border-box;
        }

        .frase-invitacion span.palabra {
            display: inline-block;
            white-space: nowrap;
            margin-right: 0.3em;
        }

        .frase-invitacion span.letra {
            opacity: 0;
            display: inline-block;
            animation: aparecerPalabra 0.8s forwards;
        }

        .mes {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 1px 1px 2px #000;
        }

        .fecha-hora {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            text-shadow: 1px 1px 2px #000;
        }

        .fecha-hora .linea {
            width: 30px;
            height: 2px;
            background-color: #d4af37;
        }

        .fecha-hora .dia-semana {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fecha-hora .dia-numero {
            font-size: 1.9rem;
            font-weight: bold;
        }

        .fecha-hora .hora {
            font-size: 0.95rem;
        }

        .lugar {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: #ffb0db;
            line-height: 1.4;
            text-shadow: 1px 1px 2px #000;
        }

        .lugar a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px solid #d4af37;
            transition: color 0.3s;
            display: inline-block;
        }

        .lugar a:hover {
            color: #f5d76e;
        }

        .lugar .ver-mapa {
            display: block;
            margin-top: 4px;
            font-size: 0.85rem;
            font-style: italic;
            color: #d4af37;
            opacity: 0.85;
        }

        /* --- ESCENA 4 --- */
        .escena-4 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 40;
            padding: 20px 20px 90px 20px;
            box-sizing: border-box;
            text-align: center;
            gap: 8px;
        }

        .escena-4 .adorno-superior {
            width: 230px;
            margin-bottom: 5px;
            opacity: 0.9;
            animation: flotar 3s infinite ease-in-out;
        }

        .frase-4 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            color: #d4af37;
            text-shadow: 1px 1px 3px #000, 0 0 8px rgba(212, 175, 55, 0.4);
            line-height: 1.6;
            padding: 0 15px;
            width: 90%;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .frase-4 span {
            opacity: 0;
            display: inline-block;
            animation: aparecerZoom 0.9s forwards ease-out;
            margin-right: 6px;
        }

        .nos-acompanas {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #9e6b6b;
            margin-top: 5px;
            margin-bottom: 0px;
            text-shadow: 1px 1px 2px rgb(148, 81, 81);
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 1.5s;
        }

        .confirmar-fecha {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3), 0 0 8px rgba(212, 175, 55, 0.5);
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 2s;
        }

        .botones-whatsapp {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
            max-width: 280px;
            margin-top: 0px;
            opacity: 0;
            animation: aparecerZoom 1s forwards ease-out;
            animation-delay: 2.5s;
        }

        .boton-wpp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .boton-wpp:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .boton-si {
            background-color: #9e6b6b;
            color: #fff;
            border-color: #d4af37;
        }

        .boton-si:hover {
            background-color: #8a5a5a;
        }

        .boton-no {
            background-color: transparent;
            color: #5a3e2b;
            border-color: #d4af37;
        }

        .boton-no:hover {
            background-color: rgba(212, 175, 55, 0.1);
        }

        .boton-wpp .icono {
            font-size: 1.1rem;
        }

        #musica {
            display: none;
        }

        /* =========================================
           FLECHAS DE NAVEGACIÓN DISCRETAS
           ========================================= */
        .nav-flechas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .nav-flechas.visible {
            opacity: 1;
        }

        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #9e6b6b;
            border: 1px solid rgba(212, 175, 55, 0.45);
            color: rgba(212, 175, 55, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.3s, transform 0.2s, opacity 0.3s;
            user-select: none;
        }

        .flecha:hover {
            background: rgba(212, 175, 55, 0.35);
            transform: translateY(-50%) scale(1.12);
        }

        .flecha.desactivada {
            opacity: 0.15;
            pointer-events: none;
        }

        .flecha-izq {
            left: 8px;
        }

        .flecha-der {
            right: 8px;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        
        <!-- ESCENA 0 (SOBRE SORPRESA) -->
        <div class="escena-0" id="escena0">
            <div class="sorpresa-texto">Esto es una sorpresa</div>
            <img src="img/sobre.png" alt="Sobre" class="sobre-img">
            <button class="btn-abrir" id="btnAbrir" onclick="abrirTarjeta()">Abrir tarjeta</button>
        </div>

        <!-- ESCENA 1 -->
        <div class="escena-1" id="escena1">
            <img src="img/50.png" alt="50 Años" class="numero-50">
            <div class="nombre" id="nombreMonica">Mónica Orona</div>
            <img src="img/zapatos.png" alt="Zapatos" class="zapatos">
            <a href="https://invitacionde.digics.app" target="_blank" class="firma">invitaciones.digics.app</a>
        </div>

        <!-- ESCENA 3 -->
        <div class="escena-3" id="escena3">
            <img src="img/50.png" alt="50 Años" class="numero-50">
            <div class="nombre-monica">Mónica</div>
            <div class="subtitulo">Mis Años Dorados</div>
            
            <div class="frase-invitacion" id="fraseInvitacion"></div>

            <div class="mes">Octubre</div>
            
            <div class="fecha-hora">
                <span class="dia-semana">Viernes</span>
                <span class="linea"></span>
                <span class="dia-numero">23</span>
                <span class="linea"></span>
                <span class="hora">22:00 PM</span>
            </div>

            <div class="lugar">
                <strong>Lugar:</strong><br>
                    La Rioja 135, Concepción
                <a href="https://www.google.com/maps/search/?api=1&query=La+Rioja+135,+Concepción,+Tucumán" target="_blank" class="ver-mapa">
                    Ver dirección en Google Maps
                </a>
            </div>
        </div>

        <!-- ESCENA 4 -->
        <div class="escena-4" id="escena4">
            <img src="img/adorno.png" alt="Adorno" class="adorno-superior">
            
            <div class="frase-4" id="frase4"></div>
                        
            <div class="nos-acompanas">¿Nos acompañás?</div>
            
            <div class="confirmar-fecha">Confirmar antes del 07/10</div>
            
            <div class="botones-whatsapp">
                <a href="https://wa.me/5493865621835?text=Hola%20Mónica,%20confirmo%20mi%20asistencia%20a%20tus%2050%20años.%20¡Sí,%20podré%20asistir!" 
                   target="_blank" 
                   class="boton-wpp boton-si"
                   onclick="apagarMusica()">
                    <span class="icono">✓</span> SÍ, PODRÉ ASISTIR
                </a>
                <a href="https://wa.me/5493865621835?text=Hola%20Mónica,%20lamento%20informarte%20que%20no%20podré%20asistir%20a%20tus%2050%20años." 
                   target="_blank" 
                   class="boton-wpp boton-no"
                   onclick="apagarMusica()">
                    <span class="icono">✕</span> NO PODRÉ ASISTIR
                </a>
            </div>
        </div>

        <!-- FLECHAS DE NAVEGACIÓN -->
        <div class="nav-flechas" id="navFlechas">
            <div class="flecha flecha-izq" id="flechaIzq" onclick="cambiarEscena(-1)">‹</div>
            <div class="flecha flecha-der" id="flechaDer" onclick="cambiarEscena(1)">›</div>
        </div>

    </div>

    <audio id="musica" src="img/bongo.mp3" preload="auto" loop></audio>

    <script>
        // --- CONFIGURACIÓN DE TIEMPOS ---
        const TIEMPO_ESPERA_ESCENA_1 = 5000;  // 5 segundos para la Escena 1
        const TIEMPO_ESPERA_ESCENA_3 = 8000;  // 8 segundos para la Escena 3
        const TIEMPO_CAIDA = 1400;             // Duración de la animación de caída

        let secuenciaIniciada = false;

        // --- CONTROL DE NAVEGACIÓN ---
        // Índice actual de la escena visible (1, 3 o 4) una vez terminada la transición
        let escenaActual = 1;
        const ordenEscenas = [1, 3, 4];

        // --- FUNCIÓN PRINCIPAL: ABRIR TARJETA ---
        function abrirTarjeta() {
            if (secuenciaIniciada) return;
            secuenciaIniciada = true;

            // Reproducir música
            const musica = document.getElementById('musica');
            musica.play().catch(e => console.log("Error al reproducir:", e));

            // Activar animación de caída en Escena 0
            const escena0 = document.getElementById('escena0');
            escena0.classList.add('cayendo');

            // Después de que termina la caída, ocultamos la escena 0 y mostramos la 1
            setTimeout(() => {
                escena0.style.opacity = '0';
                escena0.style.pointerEvents = 'none';

                const escena1 = document.getElementById('escena1');
                escena1.style.opacity = '1';
                escena1.style.pointerEvents = 'auto';

                // Activar animación de máquina de escribir recién ahora
                const nombreMonica = document.getElementById('nombreMonica');
                nombreMonica.classList.add('escribiendo');

                escenaActual = 1;

                // Iniciar secuencia
                iniciarSecuencia();

            }, TIEMPO_CAIDA);
        }

        // --- SECUENCIA DE ESCENAS (AUTOMÁTICA) ---
        function iniciarSecuencia() {
            // Preparar efecto letra por letra de la Escena 3
            iniciarEfectoLetrasEscena3();

            // Escena 1 -> Escena 3
            setTimeout(() => {
                document.getElementById('escena1').style.opacity = '0';
                document.getElementById('escena1').style.pointerEvents = 'none';

                const escena3 = document.getElementById('escena3');
                escena3.style.opacity = '1';
                escena3.style.pointerEvents = 'auto';

                escenaActual = 3;

                // Escena 3 -> Escena 4
                setTimeout(() => {
                    document.getElementById('escena3').style.opacity = '0';
                    document.getElementById('escena3').style.pointerEvents = 'none';

                    const escena4 = document.getElementById('escena4');
                    escena4.style.opacity = '1';
                    escena4.style.pointerEvents = 'auto';

                    escenaActual = 4;

                    iniciarEfectoZoomEscena4();

                    // Mostrar flechas al terminar la última escena
                    setTimeout(() => {
                        document.getElementById('navFlechas').classList.add('visible');
                        actualizarFlechas();
                    }, 1200);

                }, TIEMPO_ESPERA_ESCENA_3);

            }, TIEMPO_ESPERA_ESCENA_1);
        }

        // --- EFECTO LETRA POR LETRA (ESCENA 3) ---
        function iniciarEfectoLetrasEscena3() {
            const fraseTexto = "Acompañame a Celebrar 50 años de camino.";
            const contenedor = document.getElementById('fraseInvitacion');
            const palabras = fraseTexto.split(" ");
            contenedor.innerHTML = "";

            let contadorLetras = 0;

            palabras.forEach((palabra) => {
                const spanPalabra = document.createElement('span');
                spanPalabra.classList.add('palabra');

                for (let i = 0; i < palabra.length; i++) {
                    const spanLetra = document.createElement('span');
                    spanLetra.classList.add('letra');
                    spanLetra.textContent = palabra[i];
                    spanLetra.style.animationDelay = (contadorLetras * 0.05) + "s";
                    spanPalabra.appendChild(spanLetra);
                    contadorLetras++;
                }

                contenedor.appendChild(spanPalabra);
                contadorLetras++;
            });
        }

        // --- EFECTO ZOOM (ESCENA 4) ---
        function iniciarEfectoZoomEscena4() {
            const fraseTexto = "Porque la vida no se mide en años, sino en los momentos compartidos con las personas que aman.";
            const contenedorFrase = document.getElementById('frase4');
            const palabras = fraseTexto.split(" ");
            contenedorFrase.innerHTML = "";

            palabras.forEach((palabra, index) => {
                const spanPalabra = document.createElement('span');
                spanPalabra.textContent = palabra + " ";
                spanPalabra.style.animationDelay = (index * 0.25) + "s";
                contenedorFrase.appendChild(spanPalabra);
            });
        }

        // --- APAGAR MÚSICA AL CONFIRMAR ---
        function apagarMusica() {
            const musica = document.getElementById('musica');
            musica.pause();
            musica.currentTime = 0;
        }

        // =========================================
        // NAVEGACIÓN MANUAL CON FLECHAS
        // =========================================
        function cambiarEscena(direccion) {
            const indiceActual = ordenEscenas.indexOf(escenaActual);
            const nuevoIndice = indiceActual + direccion;

            // Si se sale del rango, no hacer nada
            if (nuevoIndice < 0 || nuevoIndice >= ordenEscenas.length) return;

            const nuevaEscena = ordenEscenas[nuevoIndice];

            // Ocultar todas las escenas
            [1, 3, 4].forEach(n => {
                const el = document.getElementById('escena' + n);
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
            });

            // Mostrar la nueva escena
            const elNueva = document.getElementById('escena' + nuevaEscena);
            elNueva.style.opacity = '1';
            elNueva.style.pointerEvents = 'auto';

            // Si es la escena 3, reactivar el efecto letra por letra
            if (nuevaEscena === 3) {
                iniciarEfectoLetrasEscena3();
            }

            // Si es la escena 4, reactivar el efecto zoom
            if (nuevaEscena === 4) {
                iniciarEfectoZoomEscena4();
            }

            escenaActual = nuevaEscena;
            actualizarFlechas();
        }

        // Actualiza el estado de las flechas según la escena actual
        function actualizarFlechas() {
            const indiceActual = ordenEscenas.indexOf(escenaActual);
            const flechaIzq = document.getElementById('flechaIzq');
            const flechaDer = document.getElementById('flechaDer');

            // Flecha izquierda desactivada en la primera escena
            if (indiceActual <= 0) {
                flechaIzq.classList.add('desactivada');
            } else {
                flechaIzq.classList.remove('desactivada');
            }

            // Flecha derecha desactivada en la última escena
            if (indiceActual >= ordenEscenas.length - 1) {
                flechaDer.classList.add('desactivada');
            } else {
                flechaDer.classList.remove('desactivada');
            }
        }
    </script>

</body>
